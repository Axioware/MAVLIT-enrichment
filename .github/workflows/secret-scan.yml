name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the scan covers the commits of this push / pull request
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the token GitHub provides to every run
          # Repositories owned by a GitHub organization also need a free gitleaks license key stored as the repository
          # secret GITLEAKS_LICENSE (https://gitleaks.io); without it the action stops with a license error.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml   # default rules + the Apify token rule
