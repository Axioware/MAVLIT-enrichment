<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompts — MAVLIT</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .nav-brand {
      font-weight: 700;
      color: #38bdf8;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: .03em;
    }
    .nav-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: .875rem;
      padding: .4rem .75rem;
      border-radius: 6px;
    }
    .nav-link:hover { background: #334155; color: #e2e8f0; }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: .3rem;
    }
    .subtitle {
      font-size: .875rem;
      color: #64748b;
      margin-bottom: 1.5rem;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      margin-bottom: 1.5rem;
    }
    .prompt-btn {
      padding: .55rem 1rem;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: .85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .prompt-btn:hover { background: #334155; }
    .prompt-btn.active {
      background: #0284c7;
      border-color: #0284c7;
      color: #fff;
    }

    #editorSection { display: none; }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
    }
    .card h2 {
      font-size: .95rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: .2rem;
    }
    .card .prompt-key {
      font-size: .78rem;
      color: #64748b;
      margin-bottom: 1rem;
      font-family: ui-monospace, monospace;
    }

    textarea {
      width: 100%;
      min-height: 380px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: .9rem;
      color: #e2e8f0;
      font-size: .85rem;
      font-family: ui-monospace, 'SF Mono', monospace;
      line-height: 1.5;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: #38bdf8; }

    .editor-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
    }
    .btn-save {
      padding: .6rem 1.4rem;
      background: #0284c7;
      color: #fff;
      font-size: .9rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-save:hover:not(:disabled) { background: #0369a1; }
    .btn-save:disabled { opacity: .6; cursor: not-allowed; }

    .status-msg {
      font-size: .85rem;
    }
    .status-msg.ok { color: #4ade80; }
    .status-msg.err { color: #f87171; }

    .empty-msg {
      font-size: .9rem;
      color: #94a3b8;
      text-align: center;
      padding: 3rem 1rem;
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-brand" href="/">&#9889; MAVLIT Pipeline</a>
    <a class="nav-link" href="/dashboard">&larr; Dashboard</a>
  </nav>

  <div class="wrap">
    <h1>Prompts</h1>
    <p class="subtitle">Every LLM prompt in the pipeline that's actually stored in the database — pick one to view or edit it. Saving here updates live, admin-editable prompt content only; it does not change any pipeline code or logic.</p>

    <div class="button-row" id="buttonRow"></div>

    <div id="editorSection">
      <div class="card">
        <h2 id="promptTitle"></h2>
        <div class="prompt-key" id="promptKey"></div>
        <textarea id="promptContent" spellcheck="false"></textarea>
        <div class="editor-footer">
          <button class="btn-save" id="saveBtn" onclick="savePrompt()">Save prompt</button>
          <span class="status-msg" id="statusMsg"></span>
        </div>
      </div>
    </div>

    <p class="empty-msg" id="emptyMsg" style="display:none;">Select a prompt above to view or edit it.</p>
  </div>

<script>
  // Each entry: display label -> prompt name stored in the database.
  // Only prompts that actually have a database-backed template are listed
  // here — embedding steps (creator/brand profile embed) have no prompt at
  // all, so they're intentionally not buttons.
  var PROMPTS = [
    { label: 'insta all creator check',                 name: 'instagram_post_full_check' },
    { label: 'insta coauthor check',                     name: 'instagram_coauthor_check' },
    { label: 'insta commenter demographics',             name: 'instagram_user_demographics' },
    { label: 'youtube commenter gender',                 name: 'youtube_commenter_gender' },
    { label: 'youtube sponsor check',                    name: 'youtube_sponsor_check' },
    { label: 'apollo contact check',                     name: 'apollo_contact_check' },
    { label: 'mavlit user content+audience value tag',   name: 'creator_content_tags' },
  ];

  var activeName = null;

  function renderButtons() {
    var row = document.getElementById('buttonRow');
    row.innerHTML = '';
    PROMPTS.forEach(function(p) {
      var btn = document.createElement('button');
      btn.className = 'prompt-btn';
      btn.textContent = p.label;
      btn.onclick = function() { loadPrompt(p); };
      btn.id = 'btn-' + p.name;
      row.appendChild(btn);
    });
  }

  function setStatus(text, isError) {
    var el = document.getElementById('statusMsg');
    el.textContent = text;
    el.className = 'status-msg ' + (isError ? 'err' : 'ok');
  }

  function loadPrompt(p) {
    activeName = p.name;
    document.querySelectorAll('.prompt-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('btn-' + p.name).classList.add('active');

    document.getElementById('emptyMsg').style.display = 'none';
    setStatus('', false);

    fetch('/prompts/' + encodeURIComponent(p.name))
      .then(function(r) {
        if (!r.ok) return r.json().then(function(e) { throw new Error(e.detail || 'Failed to load prompt'); });
        return r.json();
      })
      .then(function(data) {
        document.getElementById('promptTitle').textContent = p.label;
        document.getElementById('promptKey').textContent = p.name;
        document.getElementById('promptContent').value = data.content;
        document.getElementById('editorSection').style.display = 'block';
      })
      .catch(function(err) {
        setStatus(err.message || 'Failed to load prompt.', true);
        document.getElementById('editorSection').style.display = 'block';
      });
  }

  function savePrompt() {
    if (!activeName) return;
    var btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    setStatus('', false);

    fetch('/prompts/' + encodeURIComponent(activeName), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: document.getElementById('promptContent').value }),
    })
      .then(function(r) {
        if (!r.ok) return r.json().then(function(e) { throw new Error(e.detail || 'Save failed'); });
        return r.json();
      })
      .then(function() {
        setStatus('Saved.', false);
      })
      .catch(function(err) {
        setStatus(err.message || 'Save failed — please try again.', true);
      })
      .finally(function() {
        btn.disabled = false;
        btn.textContent = 'Save prompt';
      });
  }

  renderButtons();
  document.getElementById('emptyMsg').style.display = 'block';
</script>
</body>
</html>
