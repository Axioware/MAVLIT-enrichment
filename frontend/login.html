<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/posthog-init.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — MAVLIT</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .06em;
      color: #38bdf8;
      margin-bottom: 2rem;
      text-align: center;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: .4rem;
    }
    .subtitle {
      font-size: .875rem;
      color: #64748b;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    /* Login form */
    .field { text-align: left; margin-bottom: 1rem; }
    .field label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: .35rem;
    }
    .field input {
      width: 100%;
      padding: .65rem .85rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: .95rem;
    }
    .field input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .btn-primary {
      width: 100%;
      padding: .75rem 1.25rem;
      background: #38bdf8;
      color: #0f172a;
      font-size: .95rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .15s, opacity .15s;
    }
    .btn-primary:hover:not(:disabled) { background: #7dd3fc; }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

    .form-error {
      font-size: .825rem;
      color: #fca5a5;
      margin-top: -.4rem;
      margin-bottom: 1rem;
      text-align: left;
      display: none;
    }

    /* Spinner */
    .spinner-wrap {
      display: flex;
      justify-content: center;
      padding: .75rem 0 .5rem;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: .85rem;
      color: #64748b;
      margin-top: .5rem;
    }

    /* Error state (connection failure, not login-form validation) */
    .error-icon {
      font-size: 1.75rem;
      margin-bottom: .6rem;
      line-height: 1;
    }
    .error-text {
      font-size: .875rem;
      color: #fca5a5;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }
    .btn-retry {
      padding: .55rem 1.5rem;
      background: transparent;
      color: #38bdf8;
      font-size: .875rem;
      font-weight: 600;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-retry:hover { background: rgba(56,189,248,.1); }
    .btn-retry:focus {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }

    /* Section visibility */
    .section { display: none; }
    #loadingSection { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>

  <div class="logo">&#9889; MAVLIT Pipeline</div>

  <div class="card">

    <!-- Loading -->
    <div class="section" id="loadingSection">
      <div class="spinner-wrap"><div class="spinner"></div></div>
      <p class="loading-text">Checking authentication...</p>
    </div>

    <!-- Error -->
    <div class="section" id="errorSection">
      <div class="error-icon">&#9888;</div>
      <p class="error-text" id="errorText">Unable to connect to the server. Please try again.</p>
      <button class="btn-retry" onclick="checkAuth()">Try again</button>
    </div>

    <!-- Sign in -->
    <div class="section" id="loginSection">
      <h1>Sign in to MAVLIT</h1>
      <p class="subtitle">Enter your email and password to continue.</p>
      <form id="loginForm" onsubmit="return handleSubmit(event)">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <p class="form-error" id="loginError"></p>
        <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
      </form>
    </div>

  </div>

<script>
  var DISPLAY = { loading: 'flex', error: 'block', login: 'block' };

  function showSection(name) {
    Object.keys(DISPLAY).forEach(function(s) {
      document.getElementById(s + 'Section').style.display = 'none';
    });
    document.getElementById(name + 'Section').style.display = DISPLAY[name];
  }

  // Only a same-origin relative path is ever honored — mirrors the old
  // server-side _safe_return_to() open-redirect guard, just client-side
  // now that login is a fetch() call instead of a server-driven redirect.
  function safeReturnTo() {
    var raw = new URLSearchParams(window.location.search).get('return_to');
    if (!raw) return '/';
    if (raw.charAt(0) === '/' && raw.charAt(1) !== '/' && raw.indexOf(':') === -1) return raw;
    return '/';
  }

  function checkAuth() {
    showSection('loading');
    fetch('/auth/me', { credentials: 'include' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(user) {
        if (user) {
          window.location.replace(safeReturnTo());
        } else {
          showSection('login');
        }
      })
      .catch(function(err) {
        console.error('Auth check failed:', err);
        showSection('error');
      });
  }

  function setLoginError(message) {
    var el = document.getElementById('loginError');
    if (message) {
      el.textContent = message;
      el.style.display = 'block';
    } else {
      el.style.display = 'none';
    }
  }

  function handleSubmit(event) {
    event.preventDefault();
    setLoginError('');

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    fetch('/auth/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password }),
    })
      .then(function(r) {
        if (r.ok) {
          window.location.replace(safeReturnTo());
          return;
        }
        return r.json().then(function(data) {
          throw new Error((data && data.detail) || 'Sign in failed — please try again.');
        });
      })
      .catch(function(err) {
        setLoginError(err.message || 'Sign in failed — please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      });

    return false;
  }

  checkAuth();
</script>
</body>
</html>
