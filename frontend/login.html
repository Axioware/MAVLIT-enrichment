<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/posthog-init.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — MAVLIT</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .06em;
      color: #38bdf8;
      margin-bottom: 2rem;
      text-align: center;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: .4rem;
    }
    .subtitle {
      font-size: .875rem;
      color: #64748b;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    /* Google button */
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      width: 100%;
      padding: .75rem 1.25rem;
      background: #fff;
      color: #1f2937;
      font-size: .95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, box-shadow .15s, opacity .15s;
    }
    .btn-google:hover:not([aria-disabled="true"]) {
      background: #f1f5f9;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .btn-google:focus {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }
    .btn-google[aria-disabled="true"] {
      opacity: .65;
      cursor: not-allowed;
      pointer-events: none;
    }
    .btn-google svg { flex-shrink: 0; }

    /* Spinner */
    .spinner-wrap {
      display: flex;
      justify-content: center;
      padding: .75rem 0 .5rem;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: .85rem;
      color: #64748b;
      margin-top: .5rem;
    }

    /* Error state */
    .error-icon {
      font-size: 1.75rem;
      margin-bottom: .6rem;
      line-height: 1;
    }
    .error-text {
      font-size: .875rem;
      color: #fca5a5;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }
    .btn-retry {
      padding: .55rem 1.5rem;
      background: transparent;
      color: #38bdf8;
      font-size: .875rem;
      font-weight: 600;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-retry:hover { background: rgba(56,189,248,.1); }
    .btn-retry:focus {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }

    /* Section visibility */
    .section { display: none; }
    #loadingSection { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>

  <div class="logo">&#9889; MAVLIT Pipeline</div>

  <div class="card">

    <!-- Loading -->
    <div class="section" id="loadingSection">
      <div class="spinner-wrap"><div class="spinner"></div></div>
      <p class="loading-text">Checking authentication...</p>
    </div>

    <!-- Error -->
    <div class="section" id="errorSection">
      <div class="error-icon">&#9888;</div>
      <p class="error-text" id="errorText">Unable to connect to the server. Please try again.</p>
      <button class="btn-retry" onclick="checkAuth()">Try again</button>
    </div>

    <!-- Sign in -->
    <div class="section" id="loginSection">
      <h1>Sign in to MAVLIT</h1>
      <p class="subtitle">Continue with Google to access your account.</p>
      <a
        class="btn-google"
        id="googleBtn"
        href="/auth/google"
        aria-label="Sign in with Google"
        onclick="handleGoogleClick(this)"
      >
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        <span id="googleBtnText">Continue with Google</span>
      </a>
    </div>

  </div>

<script>
  var DISPLAY = { loading: 'flex', error: 'block', login: 'block' };

  function showSection(name) {
    Object.keys(DISPLAY).forEach(function(s) {
      document.getElementById(s + 'Section').style.display = 'none';
    });
    document.getElementById(name + 'Section').style.display = DISPLAY[name];
  }

  function checkAuth() {
    showSection('loading');
    fetch('/auth/me', { credentials: 'include' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(user) {
        if (user) {
          window.location.replace('/');
        } else {
          showSection('login');
        }
      })
      .catch(function(err) {
        console.error('Auth check failed:', err);
        showSection('error');
      });
  }

  function handleGoogleClick(btn) {
    btn.setAttribute('aria-disabled', 'true');
    document.getElementById('googleBtnText').textContent = 'Redirecting...';
  }

  function resetGoogleButton() {
    var btn = document.getElementById('googleBtn');
    btn.removeAttribute('aria-disabled');
    document.getElementById('googleBtnText').textContent = 'Continue with Google';
  }

  checkAuth();

  // Bfcache restore (e.g. user hit "back" from Google's account chooser) —
  // the page reappears with its old DOM instead of re-running from scratch,
  // so the button would stay stuck on "Redirecting..." without this.
  window.addEventListener('pageshow', function(event) {
    if (event.persisted) {
      resetGoogleButton();
      checkAuth();
    }
  });
</script>
</body>
</html>
