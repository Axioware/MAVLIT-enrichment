<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/posthog-init.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Matches — MAVLIT</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .nav-brand {
      font-weight: 700;
      color: #38bdf8;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: .03em;
    }
    .nav-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: .875rem;
      padding: .4rem .75rem;
      border-radius: 6px;
    }
    .nav-link:hover { background: #334155; color: #e2e8f0; }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: .3rem;
    }
    .subtitle {
      font-size: .875rem;
      color: #64748b;
      margin-bottom: 1.5rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .btn-refresh {
      padding: .5rem 1rem;
      background: #0284c7;
      color: #fff;
      font-size: .85rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-refresh:hover:not(:disabled) { background: #0369a1; }
    .btn-refresh:disabled { opacity: .6; cursor: not-allowed; }

    .niche-filter {
      padding: .45rem .65rem;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: .85rem;
    }
    .toolbar-actions { display: flex; align-items: center; gap: .6rem; }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: .6rem;
    }
    .brand-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f1f5f9;
    }
    .score-badge {
      appearance: none;
      font-size: .8rem;
      font-weight: 700;
      font-family: inherit;
      color: #38bdf8;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 999px;
      padding: .2rem .65rem;
      white-space: nowrap;
      cursor: help;
    }
    .score-wrap {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
    }
    .score-tooltip {
      position: absolute;
      z-index: 5;
      top: calc(100% + .5rem);
      right: 0;
      display: none;
      width: min(280px, calc(100vw - 3rem));
      padding: .75rem;
      background: #0b1220;
      border: 1px solid #475569;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgb(0 0 0 / 35%);
      color: #e2e8f0;
      font-size: .8rem;
    }
    .score-wrap:hover .score-tooltip,
    .score-wrap:focus-within .score-tooltip {
      display: block;
    }
    .score-tooltip-title {
      display: block;
      margin-bottom: .4rem;
      color: #94a3b8;
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .score-tooltip-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: .25rem 0;
    }
    .score-tooltip-row strong {
      color: #38bdf8;
    }
    .score-tooltip-row strong.score-yes { color: #22c55e; }
    .score-tooltip-row strong.score-no  { color: #f87171; }
    .reasons { list-style: none; }
    .reasons li {
      font-size: .85rem;
      color: #cbd5e1;
      padding: .35rem 0;
      border-top: 1px solid #334155;
    }
    .reasons li:first-child { border-top: none; }

    button.brand-name {
      appearance: none;
      padding: 0;
      background: none;
      border: none;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }
    button.brand-name:hover { color: #38bdf8; text-decoration: underline; }
    .reasons-toggle {
      appearance: none;
      margin-top: .5rem;
      padding: 0;
      background: none;
      border: none;
      color: #38bdf8;
      font-family: inherit;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .reasons-toggle:hover { text-decoration: underline; }

    .empty-msg, .error-msg {
      font-size: .9rem;
      color: #94a3b8;
      text-align: center;
      padding: 3rem 1rem;
    }
    .error-msg { color: #f87171; }

    .loading-wrap {
      display: flex;
      justify-content: center;
      padding: 3rem 0;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #resultsSection { display: none; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgb(2 6 23 / 70%);
    }
    .modal-overlay[hidden] { display: none; }
    .modal {
      width: min(560px, 100%);
      max-height: min(80vh, 640px);
      display: flex;
      flex-direction: column;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 12px;
      box-shadow: 0 16px 48px rgb(0 0 0 / 45%);
    }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #334155;
    }
    .modal-title { font-size: 1.05rem; font-weight: 700; color: #f1f5f9; }
    .modal-subtitle { font-size: .78rem; color: #64748b; margin-top: .2rem; }
    .modal-close {
      appearance: none;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }
    .modal-close:hover { color: #f1f5f9; }
    .modal-body { padding: .5rem 1.25rem 1rem; overflow-y: auto; }
    .modal-body .loading-wrap { padding: 2rem 0; }
    .modal-body .empty-msg, .modal-body .error-msg { padding: 2rem 0; }

    .post-row {
      padding: .75rem 0;
      border-top: 1px solid #334155;
    }
    .post-row:first-child { border-top: none; }
    .post-text {
      font-size: .85rem;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .post-text strong { color: #f1f5f9; }
    .creator-link { color: #f1f5f9; font-weight: 700; text-decoration: none; }
    .creator-link:hover { color: #38bdf8; text-decoration: underline; }
    .post-sep { margin: 0 .35rem; color: #475569; }
    .post-date { color: #94a3b8; white-space: nowrap; }
    .post-link {
      color: #38bdf8;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .post-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <nav>
    <a class="nav-brand" href="/">&#9889; MAVLIT Pipeline</a>
    <a class="nav-link" href="/creator-profile">Creator Profile</a>
  </nav>

  <div class="wrap">
    <div class="loading-wrap" id="loadingSection">
      <div class="spinner"></div>
    </div>

    <div id="resultsSection">
      <h1>Your Matches</h1>
      <p class="subtitle">Brands ranked for your profile, with the top reasons behind each match.</p>

      <div class="toolbar">
        <span class="subtitle" id="metaLine" style="margin:0;"></span>
        <div class="toolbar-actions">
          <select class="niche-filter" id="nicheFilter" onchange="applyFilterAndRender()">
            <option value="">All niches</option>
          </select>
          <button class="btn-refresh" id="refreshBtn" onclick="refreshMatches()">Force refresh</button>
        </div>
      </div>

      <div id="matchList"></div>
    </div>
  </div>

  <div class="modal-overlay" id="postsModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="postsModalTitle">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="postsModalTitle"></div>
          <div class="modal-subtitle">Creator partnership posts</div>
        </div>
        <button class="modal-close" type="button" aria-label="Close" onclick="closePostsModal()">&times;</button>
      </div>
      <div class="modal-body" id="postsModalBody"></div>
    </div>
  </div>

<script>
  function showResults() {
    document.getElementById('loadingSection').style.display = 'none';
    document.getElementById('resultsSection').style.display = 'block';
  }

  function pct(score) {
    return Math.round((score || 0) * 100) + '%';
  }

  // Graded signals show how much of their own max they earned (dimension.score =
  // earned / max, see pipeline/matching/scoring.py) — e.g. 75/100 -> 75% — and
  // are only listed when they earned something. Yes/no signals (one tagline
  // option, so only ever 0% or 100%) are always listed as a tick or cross.
  function scoreBreakdownHtml(dimensions) {
    var labels = [
      ['niche_tier', 'Niche priority'],
      ['recent_partnership', 'Recent paid partnership'],
      ['niche_creators', 'Niche + creators match'],
      ['similar_partners', 'Similar partners'],
      ['creator_size', 'Creator size'],
      ['brand_tier', 'Brand tier'],
      ['same_niche', 'Same niche', true],
      ['follower_range', 'Follower range', true],
      ['verified_contact', 'Verified contact', true],
      ['tag_overlap', 'Tag overlap', true],
      ['youtube_sponsor', 'YouTube sponsor', true],
      ['latest_product', 'Latest product', true]
    ];

    return labels.map(function(item) {
      var dimension = dimensions && dimensions[item[0]];
      if (!dimension) return '';
      var value;
      if (item[2]) {
        value = dimension.score
          ? '<strong class="score-yes" aria-label="yes">&#10003;</strong>'
          : '<strong class="score-no" aria-label="no">&#10007;</strong>';
      } else {
        if (!dimension.score) return '';
        value = '<strong>' + pct(dimension.score) + '</strong>';
      }
      return '<div class="score-tooltip-row"><span>' + item[1] + '</span>' + value + '</div>';
    }).join('');
  }

  // Holds the last-loaded full match list so the niche filter can re-render
  // instantly from memory instead of re-fetching on every selection change.
  var currentMatches = [];

  // The API returns every applicable reason; cards show the top
  // REASONS_PREVIEW and expand to the full list via "Show all N reasons".
  // Expanded brand ids survive re-renders (niche filter / refresh).
  var REASONS_PREVIEW = 5;
  var expandedBrands = {};

  function reasonsListHtml(reasons, expanded) {
    var shown = expanded ? reasons : reasons.slice(0, REASONS_PREVIEW);
    return shown.map(function(r) {
      return '<li>' + r.replace(/</g, '&lt;') + '</li>';
    }).join('');
  }

  function toggleReasons(brandId) {
    expandedBrands[brandId] = !expandedBrands[brandId];
    applyFilterAndRender();
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // post_date is YYYY-MM-DD; format in UTC so it never shifts a day.
  function formatPostDate(value) {
    if (!value) return 'Unknown date';
    var date = new Date(value + 'T00:00:00Z');
    return isNaN(date.getTime()) ? value : date.toLocaleDateString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC'
    });
  }

  // Clicking a brand opens a modal with its confirmed partnership posts.
  // Responses are cached per brand for the life of the page.
  var postsCache = {};
  var openPostsBrandId = null;

  function renderPosts(posts, brandName) {
    var body = document.getElementById('postsModalBody');
    if (!posts.length) {
      body.innerHTML = '<p class="empty-msg">No confirmed creator partnership posts for this brand yet.</p>';
      return;
    }
    body.innerHTML = posts.map(function(p) {
      var sep = '<span class="post-sep">&middot;</span>';
      return '<div class="post-row"><div class="post-text">' +
        '<strong>' + escapeHtml(brandName) + '</strong> partnered with ' + creatorsSentenceHtml(p.creators || []) +
        sep + '<span class="post-date">' + escapeHtml(formatPostDate(p.post_date)) + '</span>' +
        sep + '<a class="post-link" href="' + escapeHtml(p.post_url) + '" target="_blank" rel="noopener noreferrer">View post &#8599;</a>' +
      '</div></div>';
    }).join('');
  }

  // "@a", "@a and @b", or "@a, @b and N other(s)" — each @handle links to the creator's Instagram profile.
  function creatorsSentenceHtml(creators) {
    if (!creators.length) return 'a creator';
    var links = creators.slice(0, 2).map(function(c) {
      return '<a class="creator-link" href="https://instagram.com/' + encodeURIComponent(c) + '" target="_blank" rel="noopener noreferrer">@' + escapeHtml(c) + '</a>';
    });
    if (creators.length === 1) return links[0];
    if (creators.length === 2) return links[0] + ' and ' + links[1];
    var others = creators.length - 2;
    return links[0] + ', ' + links[1] + ' and ' + others + (others === 1 ? ' other' : ' others');
  }

  function openPostsModal(brandId, brandName) {
    openPostsBrandId = brandId;
    document.getElementById('postsModalTitle').textContent = brandName;
    document.getElementById('postsModal').hidden = false;
    document.body.style.overflow = 'hidden';

    if (postsCache[brandId]) {
      renderPosts(postsCache[brandId], brandName);
      return;
    }
    document.getElementById('postsModalBody').innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';
    fetch('/matches/me/brands/' + encodeURIComponent(brandId) + '/posts', { credentials: 'include' })
      .then(function(r) {
        if (!r.ok) return errorFromResponse(r, 'Failed to load posts');
        return r.json();
      })
      .then(function(data) {
        postsCache[brandId] = data.posts || [];
        if (openPostsBrandId === brandId) renderPosts(postsCache[brandId], brandName);
      })
      .catch(function(err) {
        if (openPostsBrandId !== brandId) return;
        document.getElementById('postsModalBody').innerHTML =
          '<p class="error-msg">' + escapeHtml(err.message || 'Failed to load posts') + '</p>';
      });
  }

  function closePostsModal() {
    openPostsBrandId = null;
    document.getElementById('postsModal').hidden = true;
    document.body.style.overflow = '';
  }

  document.getElementById('postsModal').addEventListener('click', function(e) {
    if (e.target === this) closePostsModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && openPostsBrandId !== null) closePostsModal();
  });

  // Niche options come ONLY from the brands actually matched to this
  // creator (currentMatches), not the full site-wide niche vocabulary —
  // so the dropdown never offers a niche that would filter to zero results.
  function populateNicheFilter(matches) {
    var select = document.getElementById('nicheFilter');
    var previousValue = select.value;

    var niches = Array.from(new Set(
      matches.map(function(m) { return m.niche; }).filter(function(n) { return n; })
    )).sort(function(a, b) { return a.localeCompare(b); });

    select.innerHTML = '<option value="">All niches</option>' +
      niches.map(function(n) {
        return '<option value="' + n.replace(/"/g, '&quot;') + '">' + n.replace(/</g, '&lt;') + '</option>';
      }).join('');

    // Keep the user's current filter selected across a refresh, as long as
    // that niche is still present in the new results.
    if (niches.indexOf(previousValue) !== -1) {
      select.value = previousValue;
    }
  }

  function applyFilterAndRender() {
    var selected = document.getElementById('nicheFilter').value;
    var filtered = selected
      ? currentMatches.filter(function(m) { return m.niche === selected; })
      : currentMatches;
    renderMatchList(filtered, selected);
  }

  function renderMatchList(matches, selectedNiche) {
    var list = document.getElementById('matchList');
    list.innerHTML = '';

    if (!currentMatches.length) {
      list.innerHTML = '<p class="empty-msg">No matches yet — make sure your creator profile is filled out and has been saved at least once.</p>';
      return;
    }
    if (!matches.length) {
      list.innerHTML = '<p class="empty-msg">No matches in "' + selectedNiche.replace(/</g, '&lt;') + '" — try a different niche.</p>';
      return;
    }

    matches.forEach(function(m) {
      var card = document.createElement('div');
      var reasons = m.reasons || [];
      var expandable = reasons.length > REASONS_PREVIEW;
      var expanded = expandable && !!expandedBrands[m.brand_raw_id];
      card.className = expandable ? 'card expandable' : 'card';

      var toggleHtml = expandable
        ? '<button class="reasons-toggle" type="button" aria-expanded="' + expanded + '">' +
            (expanded ? 'Show less' : 'Show all ' + reasons.length + ' reasons') +
          '</button>'
        : '';

      card.innerHTML =
        '<div class="card-head">' +
          '<button class="brand-name" type="button" title="View partnership posts">' + m.brand_name.replace(/</g, '&lt;') + '</button>' +
          '<span class="score-wrap">' +
            '<button class="score-badge" type="button" aria-label="Match score details" aria-describedby="score-tooltip-' + m.brand_raw_id + '">' + pct(m.total_score) + ' match</button>' +
            '<span class="score-tooltip" role="tooltip" id="score-tooltip-' + m.brand_raw_id + '">' +
              '<span class="score-tooltip-title">Score breakdown</span>' +
              scoreBreakdownHtml(m.dimensions) +
            '</span>' +
          '</span>' +
        '</div>' +
        '<ul class="reasons">' + reasonsListHtml(reasons, expanded) + '</ul>' +
        toggleHtml;

      card.querySelector('.brand-name').addEventListener('click', function() {
        openPostsModal(m.brand_raw_id, m.brand_name);
      });
      if (expandable) {
        card.querySelector('.reasons-toggle').addEventListener('click', function() {
          toggleReasons(m.brand_raw_id);
        });
      }

      list.appendChild(card);
    });
  }

  function renderMatches(data) {
    document.getElementById('metaLine').textContent =
      (data.cached ? 'Cached' : 'Live') + ' — computed ' + new Date(data.computed_at).toLocaleString();

    currentMatches = data.matches || [];
    populateNicheFilter(currentMatches);
    applyFilterAndRender();
  }

  function showError(message) {
    document.getElementById('matchList').innerHTML = '<p class="error-msg">' + message + '</p>';
    showResults();
  }

  function errorFromResponse(response, fallback) {
    return response.text().then(function(text) {
      try {
        var data = JSON.parse(text);
        throw new Error(data.detail || fallback);
      } catch (error) {
        if (error instanceof SyntaxError) throw new Error(text || fallback);
        throw error;
      }
    });
  }

  function loadMatches() {
    fetch('/matches/me?limit=100', { credentials: 'include' })
      .then(function(r) {
        if (r.status === 401) {
          window.location.href = '/signin?return_to=' + encodeURIComponent('/matches');
          return null;
        }
        if (!r.ok) return errorFromResponse(r, 'Failed to load matches');
        return r.json();
      })
      .then(function(data) {
        if (!data) return;
        renderMatches(data);
        showResults();
      })
      .catch(function(err) {
        showError(err.message || 'Something went wrong loading your matches.');
      });
  }

  function refreshMatches() {
    var btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.textContent = 'Refreshing…';

    fetch('/matches/me/refresh?limit=100', { method: 'POST', credentials: 'include' })
      .then(function(r) {
        if (!r.ok) return errorFromResponse(r, 'Refresh failed');
        return r.json();
      })
      .then(renderMatches)
      .catch(function(err) {
        alert(err.message || 'Refresh failed — you may be rate-limited (1/hour).');
      })
      .finally(function() {
        btn.disabled = false;
        btn.textContent = 'Force refresh';
      });
  }

  loadMatches();
</script>
</body>
</html>
